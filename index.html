<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adivinhe o desenho</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Lilita One','Arial Black',Impact,sans-serif;color:#fff}
#stage{position:absolute;width:540px;height:915px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#fff3a8,#ffb3d9 60%,#ff9ad0)}
#stage>*{position:absolute}
#piso{left:0;right:0;top:567px;bottom:0;background:linear-gradient(#6a2fa0,#b06ad0)}
#titulo{left:28px;top:30px;width:484px;height:46px;background:#fff23a;border-radius:23px;color:#111;font-size:30px;text-align:center;line-height:46px}
#titulo b{background:#7a2cff;color:#fff;border-radius:14px;padding:0 10px;margin:0 3px;font-weight:400}
.cx{background:#1a0a3d;border:3px solid #ffe14d;border-radius:14px;text-align:center;line-height:1;padding-top:6px;font-size:13px;height:40px}
.cx b{display:block;font-size:24px;font-weight:400;color:#ffe14d}
#fase{left:122px;top:84px;width:100px}#rec{left:230px;top:84px;width:195px}
#tela{left:75px;top:131px;width:397px;height:356px;background:#fff;border-radius:10px;box-shadow:0 3px 0 #0002}
#tela svg{width:100%;height:100%;display:block}
.leg{background:#8d5524;width:10px;height:120px;top:487px}
#ledge{left:65px;top:487px;width:417px;height:10px;background:#a0622d;border-radius:4px}
#pincel{left:0;top:0;font-size:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
#letras{left:0;right:0;top:505px;display:flex;justify-content:center;gap:5px}
.l{width:38px;height:46px;background:#1a0a3d;border-radius:8px;color:#ffe14d;font-size:30px;text-align:center;line-height:46px}
#legenda{left:0;right:0;top:562px;text-align:center;font-size:36px;color:#fff;-webkit-text-stroke:2px #1a0a3d;paint-order:stroke fill}
#stats{left:0;right:0;top:608px;text-align:center;font-size:15px;color:#fff;-webkit-text-stroke:1px #1a0a3d;paint-order:stroke fill}
#sapo{left:30px;top:620px;width:110px;animation:bob 1.6s ease-in-out infinite}
#sapo.pula{animation:pulo .5s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes pulo{50%{transform:translateY(-50px)}}
#presentes{left:395px;top:668px;width:108px;background:#2a1259cc;border-radius:12px;padding:6px;font-size:12px;line-height:1.1}
#presentes div{display:flex;justify-content:space-between;align-items:center;margin:5px 0;height:26px}
#vip{left:437px;top:111px;width:62px;background:#3a1670e0;border:2px solid #ffe14d;border-radius:10px;padding:4px 2px;text-align:center;font-size:9px;display:none}
#vip div{margin:3px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.av{border-radius:50%;background-size:cover;background-position:center;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;vertical-align:middle}
.panel{background:#1a0a3df2;border:3px solid #ff9cf2;border-radius:18px;text-align:center;display:none;padding:10px}
#res1{left:85px;top:292px;width:380px;height:175px}
#res2{left:50px;top:567px;width:440px;height:182px;border-color:#ffe14d;text-align:left;padding:10px 16px}
.f{font-size:34px;color:#ffe14d}.s{font-size:14px}.w{font-size:46px;color:#ffe14d;line-height:1.1}
#toast{left:0;right:0;top:642px;text-align:center;font-size:17px;opacity:0;transition:opacity .4s;color:#fff;-webkit-text-stroke:1px #1a0a3d;paint-order:stroke fill}
#teste{position:fixed;top:4px;left:4px;z-index:9;display:none;gap:4px;flex-wrap:wrap;width:300px;font-family:sans-serif}
#teste input{width:90px}
#musica{left:20px;top:772px;width:500px;background:#1a0a3dd9;border:2px solid #1db954;border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.35;display:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#musica .mt{color:#1db954;font-size:17px}#musica .mh{font-size:12px;color:#ccc}
</style></head><body>
<div id="teste"><input id="tn" value="amigo"><input id="tx" placeholder="palpite"><button id="bc">Enviar</button>
<button id="bl">+30 curtidas</button><button id="g1">Presente 1</button><button id="g5">Presente 5</button><button id="g30">Presente 30</button></div>
<div id="stage">
<div id="piso"></div>
<div id="titulo">Adivinhe o <b>DESENHO</b> no chat!</div>
<div id="fase" class="cx">FASE<b>1</b></div><div id="rec" class="cx">RECORDE DA LIVE<b>FASE 1</b></div>
<div class="leg" style="left:100px;transform:rotate(8deg)"></div><div class="leg" style="left:268px"></div><div class="leg" style="left:435px;transform:rotate(-8deg)"></div>
<div id="tela"><svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
<div id="ledge"></div>
<div id="pincel">🖌️</div>
<div id="letras"></div>
<div id="legenda">Adivinhe no chat!</div>
<div id="stats"></div>
<svg id="sapo" viewBox="0 0 100 130"><ellipse cx="50" cy="92" rx="26" ry="32" fill="#7ee27e"/><ellipse cx="50" cy="102" rx="15" ry="20" fill="#f1ffe6"/><circle cx="50" cy="54" r="30" fill="#7ee27e"/><circle cx="35" cy="36" r="11" fill="#fff"/><circle cx="65" cy="36" r="11" fill="#fff"/><circle cx="37" cy="37" r="5" fill="#222"/><circle cx="63" cy="37" r="5" fill="#222"/><path d="M34 64Q50 78 66 64" stroke="#222" stroke-width="3" fill="none"/><ellipse cx="28" cy="58" rx="6" ry="4" fill="#ff9ab0"/><ellipse cx="72" cy="58" rx="6" ry="4" fill="#ff9ab0"/><path d="M22 28Q50 0 78 28Z" fill="#d62828"/><circle cx="50" cy="8" r="4" fill="#d62828"/><text x="64" y="108" font-size="26">🎨</text></svg>
<div id="presentes"><div>🖌️ PINCEL TURBO <span>5</span></div><div>🖼️ DESENHO PRONTO <span>30</span></div><div>🔤 LETRA <span>1</span></div></div>
<div id="vip"></div>
<div id="toast"></div>
<div id="musica"></div>
<div id="res1" class="panel"></div><div id="res2" class="panel"></div>
</div>
<script type="module">
const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const agora = () => performance.now() / 1000;
function h(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; return d; }
function fit() { const s = Math.min(innerWidth / 540, innerHeight / 915), st = $('stage').style; st.transform = `scale(${s})`; st.left = (innerWidth - 540 * s) / 2 + 'px'; st.top = (innerHeight - 915 * s) / 2 + 'px'; }
addEventListener('resize', fit); fit();

// ---------- Desenhos (formas em tela 100x100) ----------
const E = (x, y, rx, ry, f) => ['e', x, y, rx, ry, f], R = (x, y, w, hh, f) => ['r', x, y, w, hh, f];
const P = (f, ...p) => ['p', p, f], L = (x1, y1, x2, y2, c = '#1b0a4a', w = 1.4) => ['l', x1, y1, x2, y2, c, w];
const pet = (cx, cy, a, l, w, f) => { const pts = []; for (let i = 0; i < 14; i++) { const t = i / 14 * 6.2832, u = Math.cos(t) * l / 2, v = Math.sin(t) * w / 2, c = Math.cos(a), s = Math.sin(a);
  pts.push([(cx + u * c - v * s + c * l / 2).toFixed(1), (cy + u * s + v * c + s * l / 2).toFixed(1)]); } return ['p', pts, f]; };
const estrela = [...Array(10)].map((_, i) => { const r = i % 2 ? 15 : 38, a = -Math.PI / 2 + i * Math.PI / 5; return [(50 + r * Math.cos(a)).toFixed(1), (54 + r * Math.sin(a)).toFixed(1)]; });
const raios = [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); return L(50 + 24 * c, 50 + 24 * s, 50 + 40 * c, 50 + 40 * s, '#ff9f1c', 3.5); });
const DR = [
  { w: 'SOL', s: [...raios, E(50, 50, 18, 18, '#ffd400')] },
  { w: 'CASA', s: [R(22, 48, 56, 38, '#f6d6a0'), P('#e63946', [16, 48], [50, 20], [84, 48]), R(44, 62, 14, 24, '#8d5524'), R(28, 56, 12, 12, '#8ecae6'), R(64, 56, 11, 11, '#8ecae6')] },
  { w: 'ÁRVORE', s: [R(44, 55, 12, 34, '#8d5524'), E(50, 38, 24, 20, '#2ecc40'), E(33, 50, 15, 11, '#2ecc40'), E(67, 50, 15, 11, '#2ecc40')] },
  { w: 'GATO', s: [E(50, 60, 26, 24, '#9aa0a6'), P('#9aa0a6', [27, 50], [30, 20], [46, 40]), P('#9aa0a6', [73, 50], [70, 20], [54, 40]), E(41, 56, 4, 5, '#ffd400'), E(59, 56, 4, 5, '#ffd400'), P('#ff8fa3', [47, 66], [53, 66], [50, 70]), L(30, 66, 14, 62), L(30, 70, 14, 74), L(70, 66, 86, 62), L(70, 70, 86, 74)] },
  { w: 'PEIXE', s: [E(46, 52, 28, 18, '#ff9f1c'), P('#ff9f1c', [70, 52], [92, 32], [92, 72]), P('#e76f51', [40, 36], [52, 22], [58, 38]), E(33, 47, 4, 4, '#fff'), E(33, 47, 1.6, 1.6, '#1b0a4a')] },
  { w: 'ESTRELA', s: [['p', estrela, '#ffd400']] },
  { w: 'BARCO', s: [P('#8d5524', [12, 62], [88, 62], [74, 82], [26, 82]), L(50, 62, 50, 16, '#8d5524', 2.4), P('#e63946', [47, 22], [47, 58], [22, 58]), P('#ffffff', [53, 20], [53, 58], [80, 58]), E(50, 88, 40, 5, '#4dabf7')] },
  { w: 'CARRO', s: [R(10, 50, 80, 24, '#e63946'), P('#e63946', [26, 50], [37, 32], [65, 32], [76, 50]), P('#8ecae6', [32, 48], [39, 36], [49, 36], [49, 48]), P('#8ecae6', [54, 48], [54, 36], [63, 36], [70, 48]), E(30, 76, 9, 9, '#222'), E(70, 76, 9, 9, '#222')] },
  { w: 'MAÇÃ', x: ['maca'], s: [E(50, 58, 28, 26, '#e63946'), L(50, 34, 52, 18, '#8d5524', 2.6), E(63, 22, 11, 5, '#2ecc40')] },
  { w: 'SORVETE', s: [P('#e9b872', [32, 52], [68, 52], [50, 92]), E(50, 44, 20, 14, '#ff8fab'), E(50, 30, 14, 11, '#ffd1dc'), E(50, 18, 3.5, 3.5, '#e63946')] },
  { w: 'GIRASSOL', s: [L(50, 48, 50, 94, '#2ecc40', 3.6), E(34, 78, 15, 6, '#2ecc40'), E(66, 68, 15, 6, '#2ecc40'), ...[...Array(12)].map((_, i) => pet(50, 32, i * Math.PI / 6, 24, 11, '#ffe600')), E(50, 32, 12, 12, '#6b3a12')] }
];
function mk(sh) {
  const k = sh[0], el = document.createElementNS(NS, { e: 'ellipse', r: 'rect', p: 'polygon', l: 'line' }[k]);
  const a = o => Object.entries(o).forEach(([n, v]) => el.setAttribute(n, v));
  let fill = null, stroke = '#1b0a4a', sw = 1.1;
  if (k == 'e') { a({ cx: sh[1], cy: sh[2], rx: sh[3], ry: sh[4] }); fill = sh[5]; }
  if (k == 'r') { a({ x: sh[1], y: sh[2], width: sh[3], height: sh[4], rx: 1.5 }); fill = sh[5]; }
  if (k == 'p') { a({ points: sh[1].join(' ') }); fill = sh[2]; }
  if (k == 'l') { a({ x1: sh[1], y1: sh[2], x2: sh[3], y2: sh[4] }); stroke = sh[5]; sw = sh[6]; }
  a({ stroke, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none' });
  const len = el.getTotalLength(); el.style.strokeDasharray = len; el.style.strokeDashoffset = len; el.style.opacity = 0;
  return { el, len, fill };
}

// ---------- Estado do jogo ----------
let fase = 1, recorde = 1, likes = 0, bag = [], cur = null, st = 'idle', t0 = 0, prog = 0, els = [], turboAte = 0, fastAll = false;
let revealed = new Set(), certos = [], erros = {}, janelaFim = 0, fimDesenho = 0, resFim = 0;
try { recorde = +localStorage.getItem('recordeFase') || 1; } catch {}
const users = {}, PER = 2.2;

function hud() {
  $('fase').lastChild.textContent = fase; $('rec').lastChild.textContent = 'FASE ' + recorde;
  $('stats').textContent = `acertos ${certos.length} · ❤ ${likes}/90 curtidas = dica`;
}
function letras(final) {
  const c = $('letras'); c.textContent = ''; const w = cur.w, wd = Math.min(38, 340 / w.length);
  [...w].forEach((ch, i) => { const d = h('l', final || revealed.has(i) ? ch : '_'); d.style.width = wd + 'px'; c.appendChild(d); });
}
function dica() {
  if (!cur || revealed.size >= cur.w.length - 1) return;
  const livres = [...cur.w].map((_, i) => i).filter(i => !revealed.has(i));
  revealed.add(livres[Math.floor(Math.random() * livres.length)]); letras(false);
}
function av(u, sz) {
  const d = document.createElement('span'); d.className = 'av'; d.style.cssText = `width:${sz}px;height:${sz}px;font-size:${sz * .5}px;background-color:hsl(${[...u.id].reduce((a, c) => a + c.charCodeAt(0), 0) * 37 % 360} 65% 50%)`;
  d.textContent = (u.id[0] || '?').toUpperCase();
  if (/^https:/.test(u.foto || '')) { const i = new Image(); i.referrerPolicy = 'no-referrer'; i.onload = () => { d.textContent = ''; d.style.backgroundImage = `url("${i.src}")`; }; i.src = u.foto; }
  return d;
}
function vip() {
  const top = Object.values(users).filter(u => u.score > 0).sort((a, b) => b.score - a.score).slice(0, 5), c = $('vip');
  c.style.display = top.length ? 'block' : 'none'; c.textContent = ''; c.appendChild(h('', '★ VIP'));
  top.forEach(u => { const r = document.createElement('div'); r.appendChild(av(u, 30)); r.appendChild(h('', '@' + u.id)); c.appendChild(r); });
}
function toast(t) { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.opacity = 0, 2500); }

function novaRodada() {
  if (!bag.length) bag = DR.map((_, i) => i).sort(() => Math.random() - .5);
  cur = DR[bag.pop()]; const svg = $('svg'); svg.textContent = ''; els = cur.s.map(mk); els.forEach(e => svg.appendChild(e.el));
  prog = 0; turboAte = 0; fastAll = false; certos = []; erros = {}; revealed = new Set(); fimDesenho = 0; t0 = agora(); st = 'draw';
  $('res1').style.display = $('res2').style.display = 'none'; $('pincel').style.opacity = 1; letras(false); hud();
}
function terminar(ok) {
  st = 'result'; resFim = agora() + 8; fastAll = false; letras(true); $('pincel').style.opacity = 0;
  const r1 = $('res1'), r2 = $('res2'); r1.textContent = ''; r2.textContent = '';
  if (!ok) { fase = 1; r1.append(h('f', 'NINGUÉM ACERTOU'), h('s', 'ERA'), h('w', cur.w)); r1.style.display = 'block'; hud(); return; }
  const novoRec = fase + 1 > recorde; fase++; if (novoRec) { recorde = fase; try { localStorage.setItem('recordeFase', recorde); } catch {} }
  const aj = Object.entries(erros).filter(([id]) => !certos.some(c => c.u.id === id)).sort((a, b) => b[1] - a[1]).slice(0, 3);
  aj.forEach(([id, n]) => users[id].score += n); vip(); hud();
  r1.append(h('f', `FASE ${fase}!`)); if (novoRec) r1.append(h('s', 'NOVO RECORDE DA LIVE!'));
  r1.append(h('s', 'ERA'), h('w', cur.w), h('s', `${certos.length} acertaram · 1º @${certos[0].u.id}`)); r1.style.display = 'block';
  const p = certos[0]; r2.append(h('f', 'FOI CERTEIRO!'), h('', '@' + p.u.id), h('s', `Era ${cur.w} · acertou em ${Math.round(p.t)} s · +${p.pts} pts`), h('s', 'QUEM MAIS AJUDOU'));
  const ra = document.createElement('div'); aj.forEach(([id, n]) => { const sp = document.createElement('span'); sp.style.marginRight = '12px'; sp.append(av(users[id], 26), ` @${id} ${n} pts`); ra.appendChild(sp); }); r2.appendChild(ra);
  const todos = [...certos.map(c => c.u), ...aj.map(([id]) => users[id])];
  r2.append(h('s', `TODO MUNDO QUE PONTUOU (${todos.length})`)); const rt = document.createElement('div'); todos.slice(0, 10).forEach(u => rt.appendChild(av(u, 26))); r2.appendChild(rt);
  r2.style.display = 'block'; const sp = $('sapo'); sp.classList.add('pula'); setTimeout(() => sp.classList.remove('pula'), 1600);
}

// ---------- Eventos ----------
function pessoa(id, foto) { id = String(id || 'anonimo').slice(0, 16); const u = users[id] || (users[id] = { id, foto: '', score: 0 }); if (foto) u.foto = foto; return u; }
function chat(id, foto, text) {
  const u = pessoa(id, foto); if (st != 'draw' && st != 'janela') return;
  const g = norm(text); if (!g) return; const resp = [cur.w, ...(cur.x || [])].map(norm);
  if (resp.includes(g) || g.split(' ').some(w => resp.includes(w))) {
    if (certos.some(c => c.u === u)) return;
    const pts = [10, 7, 5, 3][certos.length] || 2; certos.push({ u, t: agora() - t0, pts }); u.score += pts;
    if (certos.length == 1) { st = 'janela'; fastAll = true; janelaFim = agora() + 6; }
    hud(); vip();
  } else erros[u.id] = Math.min(2, (erros[u.id] || 0) + 1);
}
function curtir(n) { likes += n; while (likes >= 90) { likes -= 90; dica(); toast('❤ Dica liberada!'); } hud(); }
function presente(id, foto, d, nome) {
  const u = pessoa(id, foto); if (st != 'draw') return;
  if (d >= 30) { fastAll = true; toast(`@${u.id} mandou DESENHO PRONTO!`); }
  else if (d >= 5) { turboAte = agora() + 10; toast(`@${u.id} ativou o PINCEL TURBO!`); }
  else { dica(); toast(`@${u.id} liberou uma LETRA!`); }
}

function musica(d) {
  const p = $('musica'); p.style.display = 'block'; p.textContent = '';
  p.append(h('mt', d.tocando ? `🎵 Tocando: ${d.tocando.nome} — ${d.tocando.artista}` : '🎵 Peça sua música no chat!'));
  d.fila.slice(0, 3).forEach((f, i) => p.append(h('', `${i + 1}. ${f.nome} — ${f.artista} (@${f.user})`)));
  if (d.fila.length > 3) p.append(h('', `+${d.fila.length - 3} na fila`));
  p.append(h('mh', 'Digite !mp + nome da música'));
}
// ---------- Loop ----------
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick); const dt = Math.min(.1, (now - last) / 1000); last = now; const s = agora();
  if (st == 'draw' || st == 'janela') {
    prog = Math.min(els.length, prog + dt * (fastAll ? 30 : s < turboAte ? 3 : 1) / PER); if (prog >= els.length && st == 'draw') fastAll = false;
    els.forEach((e, i) => { const p = Math.max(0, Math.min(1, prog - i)), q = e.fill ? Math.min(1, p * 2) : p;
      e.el.style.opacity = p > 0 ? 1 : 0; e.el.style.strokeDashoffset = e.len * (1 - q);
      if (e.fill) { e.el.setAttribute('fill', e.fill); e.el.style.fillOpacity = Math.max(0, (p - .5) * 2); } });
    const i = Math.min(Math.floor(prog), els.length - 1), e = els[i];
    if (prog < els.length) { const p = Math.min(1, prog - i), q = e.fill ? Math.min(1, p * 2) : p, pt = e.el.getPointAtLength(e.len * q);
      $('pincel').style.opacity = 1; $('pincel').style.transform = `translate(${75 + pt.x * 3.97 - 8}px,${131 + pt.y * 3.56 - 30}px)`; } else $('pincel').style.opacity = 0;
    if (st == 'draw') { if (prog >= els.length && !fimDesenho) fimDesenho = s; if (fimDesenho && s > fimDesenho + 12) terminar(false); }
    else if (s > janelaFim) terminar(true);
  } else if (st == 'result' && s > resFim) novaRodada();
}
requestAnimationFrame(tick); novaRodada(); vip();

// ---------- Conexão e teste ----------
(function conectar() {
  const w = new WebSocket((location.protocol == 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onmessage = e => { const d = JSON.parse(e.data);
    if (d.t == 'chat') chat(d.id, d.foto, d.text); if (d.t == 'like') curtir(d.n); if (d.t == 'gift') presente(d.id, d.foto, d.d, d.gift);
    if (d.t == 'musica') musica(d); if (d.t == 'aviso') toast(d.text); };
  w.onclose = () => setTimeout(conectar, 2000);
  setInterval(() => { if (w.readyState == 1) w.send('ping'); }, 25000);
})();
if (new URLSearchParams(location.search).has('teste')) {
  $('teste').style.display = 'flex';
  $('bc').onclick = () => { chat($('tn').value, '', $('tx').value); $('tx').value = ''; };
  $('bl').onclick = () => curtir(30);
  [1, 5, 30].forEach(n => $('g' + n).onclick = () => presente($('tn').value, '', n, 'Rosa'));
}
</script></body></html>
