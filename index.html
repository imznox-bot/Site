let rodada = 0, total = 0, esc = 1, trail = [], ti = 0, bpos = null, ang = 0;
const f2 = n => n.toFixed(2);
function parcial(e, q) {   // traço do começo até a fração q do contorno

  while (i < p.length && c[i] <= L) { d += `L${f2(p[i][0])} ${f2(p[i][1])}`; i++; }
  let x = p[p.length - 1][0], y = p[p.length - 1][1];
  if (i < p.length) { const u = (L - c[i - 1]) / ((c[i] - c[i - 1]) || 1); x = p[i - 1][0] + (p[i][0] - p[i - 1][0]) * u; y = p[i - 1][1] + (p[i][1] - p[i - 1][1]) * u; d += `L${f2(x)} ${f2(y)}`; }

}

    if (fe) {

      e.rows = [...Array(N)].map((_, r) => { const rc = document.createElementNS(NS, 'rect'); rc.setAttribute('y', bb.y + r * bb.height / N - .4); rc.setAttribute('height', bb.height / N + .8); rc.setAttribute('x', bb.x); rc.setAttribute('width', 0); cp.appendChild(rc); return rc; });

let ws;
(function conectar() {

    if (d.t == 'estado') aplicar(d); if (d.t == 'toast' || d.t == 'aviso') toast(d.text); if (d.t == 'confete') confete(); if (d.t == 'musica') musica(d); };
