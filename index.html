// ---------- Estado do jogo ----------

let revealed = new Set(), certos = [], erros = {}, janelaFim = 0, fimDesenho = 0, resFim = 0;

const users = {}, PER = 2.2;

function hud() {
  $('fase').lastChild.textContent = fase; $('rec').lastChild.textContent = 'FASE ' + recorde;
  $('stats').replaceChildren(`acertos ${certos.length} · `, emo('2764_fe0f', 15), ` ${likes}/90 curtidas = dica`); $('fill').style.width = likes / 90 * 100 + '%';
}
function letras(final) {
  const c = $('letras'); c.textContent = ''; const w = cur.w, wd = Math.min(38, 340 / w.length);

function av(u, sz) {

  c.style.display = top.length ? 'block' : 'none'; c.textContent = ''; const hv = h('', ''); hv.append(emo('1f451', 14), ' VIP'); c.appendChild(hv);

}
function toast(t) { const e = $('balao'); e.textContent = t; e.style.opacity = 1; e.style.transform = 'scale(1)'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.opacity = 0; e.style.transform = 'scale(.8)'; }, 3500); }

function novaRodada() {
  if (!bag.length) { bag = DR.map((_, i) => i).sort(() => Math.random() - .5); if (bag.length > 1 && bag[bag.length - 1] === ultimo) bag.unshift(bag.pop()); }
  ultimo = bag.pop(); cur = DR[ultimo]; const svg = $('svg'); svg.textContent = ''; montar(svg);
  prog = 0; turboAte = 0; fastAll = false; certos = []; erros = {}; revealed = new Set(); fimDesenho = 0; t0 = agora(); st = 'draw';
  $('res1').style.display = $('res2').style.display = 'none'; $('pincel').style.opacity = 1; letras(false); hud(); humor('pintando'); toast(['Olha o que eu vou desenhar!', 'Quem adivinha primeiro?', 'Prestem atenção, chat!'][Math.random() * 3 | 0]);
}
function terminar(ok) {

  const r1 = $('res1'), r2 = $('res2'); r1.textContent = ''; r2.textContent = '';
  if (!ok) { fase = 1; r1.append(h('f', 'NINGUÉM ACERTOU'), h('s', 'ERA'), h('w', cur.w)); r1.style.display = 'block'; hud(); humor('triste'); toast('Ihh... ninguém acertou!'); return; }
  const novoRec = fase + 1 > recorde; fase++; if (novoRec) { recorde = fase; try { localStorage.setItem('recordeFase', recorde); } catch {} }
  const aj = Object.entries(erros).filter(([id]) => !certos.some(c => c.u.id === id)).sort((a, b) => b[1] - a[1]).slice(0, 3);
  aj.forEach(([id, n]) => users[id].score += n); vip(); hud();
  r1.append(h('f', `FASE ${fase}!`)); if (novoRec) r1.append(h('s', 'NOVO RECORDE DA LIVE!'));
  r1.append(h('s', 'ERA'), h('w', cur.w), h('s', `${certos.length} acertaram · 1º @${certos[0].u.id}`)); r1.style.display = 'block';
  const p = certos[0], hd = h('f', ''), ln = h('', ''); hd.append(emo('1f451', 34, 1), ' FOI CERTEIRO! ', emo('1f389', 34, 1)); ln.style.cssText = 'display:flex;align-items:center;gap:10px;font-size:24px;margin:2px 0'; ln.append(av(p.u, 44), '@' + p.u.id); r2.append(hd, ln, h('s', `Era ${cur.w} · acertou em ${Math.round(p.t)} s · +${p.pts} pts`), h('s', 'QUEM MAIS AJUDOU'));
  const ra = document.createElement('div'); aj.forEach(([id, n]) => { const sp = document.createElement('span'); sp.style.marginRight = '12px'; sp.append(av(users[id], 26), ` @${id} ${n} pts`); ra.appendChild(sp); }); r2.appendChild(ra);
  const todos = [...certos.map(c => c.u), ...aj.map(([id]) => users[id])];
  r2.append(h('s', `TODO MUNDO QUE PONTUOU (${todos.length})`)); const rt = document.createElement('div'); todos.slice(0, 10).forEach(u => rt.appendChild(av(u, 26))); r2.appendChild(rt);
  r2.style.display = 'block'; humor('feliz pula'); confete(); toast(`Arrasou, @${p.u.id}!`);
}

// ---------- Eventos ----------
function pessoa(id, foto) { id = String(id || 'anonimo').slice(0, 16); const u = users[id] || (users[id] = { id, foto: '', score: 0 }); if (foto) u.foto = foto; return u; }
function chat(id, foto, text) {
  const u = pessoa(id, foto); if (st != 'draw' && st != 'janela') return;
  const g = norm(text); if (!g) return; const resp = [cur.w, ...(cur.x || [])].map(norm);
  if (resp.includes(g) || g.split(' ').some(w => resp.includes(w))) {
    if (certos.some(c => c.u === u)) return;
    const pts = [10, 7, 5, 3][certos.length] || 2; certos.push({ u, t: agora() - t0, pts }); u.score += pts;
    if (certos.length == 1) { st = 'janela'; fastAll = true; janelaFim = agora() + 6; }
    hud(); vip();
  } else erros[u.id] = Math.min(2, (erros[u.id] || 0) + 1);
}
function curtir(n) { likes += n; while (likes >= 90) { likes -= 90; dica(); toast('❤ Dica liberada!'); } hud(); }
function presente(id, foto, d, nome) {
  const u = pessoa(id, foto); if (st != 'draw') return;
  if (d >= 30) { fastAll = true; toast(`@${u.id} mandou DESENHO PRONTO!`); }
  else if (d >= 5) { turboAte = agora() + 10; toast(`@${u.id} ativou o PINCEL TURBO!`); }
  else { dica(); toast(`@${u.id} liberou uma LETRA!`); }
}

function musica(d) {
  const p = $('musica'); p.style.display = 'block'; p.textContent = '';
  const mt = h('mt', ''); mt.append(emo('1f3b5', 20), d.tocando ? ` Tocando: ${d.tocando.nome} — ${d.tocando.artista}` : ' Peça sua música no chat!');
  if (d.tocando) { const eq = document.createElement('span'); eq.className = 'eq'; eq.innerHTML = '<i></i><i></i><i></i>'; mt.append(eq); } p.append(mt);
  d.fila.slice(0, 3).forEach((f, i) => p.append(h('', `${i + 1}. ${f.nome} — ${f.artista} (@${f.user})`)));
  if (d.fila.length > 3) p.append(h('', `+${d.fila.length - 3} na fila`));
  p.append(h('mh', 'Digite !mp + nome da música'));
}
// @@ANIM
let ultimo = -1, rodada = 0, total = 0, esc = 1, trail = [], ti = 0, bpos = null, ang = 0;
const f2 = n => n.toFixed(2);
function parcial(e, q) {   // traço do começo até a fração q do contorno
  const L = q * e.len, c = e.cum, p = e.pts; let d = `M${f2(p[0][0])} ${f2(p[0][1])}`, i = 1;
  while (i < p.length && c[i] <= L) { d += `L${f2(p[i][0])} ${f2(p[i][1])}`; i++; }
  let x = p[p.length - 1][0], y = p[p.length - 1][1];
  if (i < p.length) { const u = (L - c[i - 1]) / ((c[i] - c[i - 1]) || 1); x = p[i - 1][0] + (p[i][0] - p[i - 1][0]) * u; y = p[i - 1][1] + (p[i][1] - p[i - 1][1]) * u; d += `L${f2(x)} ${f2(y)}`; }

}
function montar(svg) {
  rodada++; const defs = document.createElementNS(NS, 'defs'); svg.appendChild(defs);
  els = cur.s.map(mk); let t = 0, last = [-10, 104];
  els.forEach((e, i) => {
    let fe = null;
    if (e.fill) { fe = document.createElementNS(NS, 'path'); fe.setAttribute('d', 'M' + e.pts.map(q => f2(q[0]) + ' ' + f2(q[1])).join('L') + 'Z'); fe.setAttribute('fill', e.fill); fe.setAttribute('stroke', 'none'); svg.appendChild(fe); }
    svg.appendChild(e.el);
    const bb = e.bb, p0 = e.pts[0], dist = Math.hypot(p0[0] - last[0], p0[1] - last[1]);
    e.pa = last; e.pb = [p0[0], p0[1]]; e.tT = t; e.dT = .3 + Math.min(.4, dist / 160); t += e.dT; e.tO = t; e.dO = Math.max(.6, e.len / 40); t += e.dO;
    if (fe) {
      const N = Math.max(3, Math.min(9, Math.round(bb.height / 7))), cp = document.createElementNS(NS, 'clipPath'); cp.id = `cp${rodada}_${i}`; defs.appendChild(cp);
      e.rows = [...Array(N)].map((_, r) => { const rc = document.createElementNS(NS, 'rect'); rc.setAttribute('y', bb.y + r * bb.height / N - .4); rc.setAttribute('height', bb.height / N + .8); rc.setAttribute('x', bb.x); rc.setAttribute('width', 0); cp.appendChild(rc); return rc; });
      fe.setAttribute('clip-path', `url(#${cp.id})`);
      e.tF = t; e.dF = .6 + Math.sqrt(bb.width * bb.height) / 30; t += e.dF; last = [N % 2 ? bb.x + bb.width : bb.x, bb.y + (N - .5) * bb.height / N];
    } else { const pe = e.pts[e.pts.length - 1]; last = [pe[0], pe[1]]; }
    e.tE = t;
  });
  total = t + .4; esc = Math.min(60, 28 + 2.2 * els.length) / total; trail = []; ti = 0; bpos = null; const g = document.createElementNS(NS, 'g'); svg.appendChild(g);
  for (let k = 0; k < 14; k++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 0); c.style.opacity = 0; g.appendChild(c); trail.push(c); }
}
function desenhar(dt, s) {
  prog += dt * (fastAll ? 30 : s < turboAte ? 3.5 : 1) / esc; const T = prog; let ai = -1;
  trail.forEach(k => { k.style.opacity *= .88; k.setAttribute('r', k.getAttribute('r') * .96); });
  els.forEach((e, i) => {
    const q = Math.max(0, Math.min(1, (T - e.tO) / e.dO));
    if (T >= e.tO && !e.fin) { e.el.setAttribute('d', parcial(e, q).d); if (q >= 1) e.fin = true; }
    if (e.rows) { const f = Math.max(0, Math.min(1, (T - e.tF) / e.dF));
      if (f > 0 && !e.fdone) { const N = e.rows.length, tt = f * N, r = Math.min(N - 1, Math.floor(tt)), fr = f >= 1 ? 1 : tt - r, b = e.bb;
        e.rows.forEach((rc, k) => { let x = b.x - 1, w = 0; if (k < r || f >= 1) w = b.width + 2; else if (k == r) { w = fr * b.width + 1; if (k % 2) x = b.x + b.width - fr * b.width; } rc.setAttribute('x', x); rc.setAttribute('width', w); });
        if (f >= 1) e.fdone = true; } }
    if (T >= e.tT && T < e.tE) ai = i;
  });
  let bx = null, by = 0, cor = '#1b0a4a', pin = false;

    else if (!e.rows || T < e.tF) { const q = Math.max(0, Math.min(1, (T - e.tO) / e.dO)), pt = parcial(e, q); bx = pt.x; by = pt.y; cor = e.stroke; pin = true; }
    else { const b = e.bb, N = e.rows.length, f = Math.min(1, (T - e.tF) / e.dF), tt = f * N, r = Math.min(N - 1, Math.floor(tt)), fr = tt - r; bx = r % 2 ? b.x + b.width - fr * b.width : b.x + fr * b.width; by = b.y + (r + .5) * b.height / N; cor = e.fill; pin = true; }
  }
  const pc = $('pincel');
  if (bx != null) { const px = 75 + bx * 3.97, py = 131 + by * 3.56; ang += (Math.max(-28, Math.min(28, (px - (bpos ? bpos[0] : px)) * 2.5)) - ang) * .25; bpos = [px, py];
    pc.style.opacity = 1; pc.style.transform = `translate(${px - 6}px,${py - 60}px) rotate(${ang}deg)`; $('ponta').setAttribute('fill', cor); olhar(px, py);
    if (pin) { const k = trail[ti++ % trail.length]; k.setAttribute('cx', bx); k.setAttribute('cy', by); k.setAttribute('fill', cor); k.setAttribute('r', 1.8); k.style.opacity = .85; } }
  else { pc.style.opacity = 0; olhar(null); bpos = null; }
  if (T >= total) fastAll = false;
  return T >= total;
}
// @@FIM
// ---------- Loop ----------
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick); const dt = Math.min(.1, (now - last) / 1000); last = now; const s = agora();
  if (st == 'draw' || st == 'janela') {
    const feito = desenhar(dt, s);
    if (st == 'draw') { if (feito && !fimDesenho) fimDesenho = s; if (fimDesenho && s > fimDesenho + 15) terminar(false); }
    else if (s > janelaFim) terminar(true);
  } else if (st == 'result') { olhar(null); if (s > resFim) novaRodada(); }
}
requestAnimationFrame(tick); novaRodada(); vip();

// ---------- Conexão e teste ----------
(function conectar() {
  if (!/^https?:$/.test(location.protocol)) return;   // aberto como arquivo: não tem servidor
  const w = new WebSocket((location.protocol == 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onmessage = e => { const d = JSON.parse(e.data);
    if (d.t == 'chat') chat(d.id, d.foto, d.text); if (d.t == 'like') curtir(d.n); if (d.t == 'gift') presente(d.id, d.foto, d.d, d.gift);
    if (d.t == 'musica') musica(d); if (d.t == 'aviso') toast(d.text); };
  w.onclose = () => setTimeout(conectar, 2000);
  setInterval(() => { if (w.readyState == 1) w.send('ping'); }, 25000);
})();
if (new URLSearchParams(location.search).has('teste')) {
  $('teste').style.display = 'flex';
  $('bc').onclick = () => { chat($('tn').value, '', $('tx').value); $('tx').value = ''; };
  $('bl').onclick = () => curtir(30); $('bn').onclick = () => novaRodada();
  [1, 5, 30].forEach(n => $('g' + n).onclick = () => presente($('tn').value, '', n, 'Rosa'));
}
